command:
  - "python"
  - "-m"
  - "uvicorn"
  - "app:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  - name: ADME_CATALOG
    value: "oil_pump_monitor_catalog"
  - name: ADME_SCHEMA
    value: "subsurface_command"
  - name: DATABRICKS_WAREHOUSE_ID
    value: "87e069097741b56c"
  - name: DCC_DB_PATH
    value: ":memory:"

  - name: GENIE_SPACE_ID
    value: "01f17bdeaeee136fbd65013d3eb40261"
  - name: GENIE_HOST
    value: "https://fevm-oil-pump-monitor.cloud.databricks.com"

  - name: VS_ENDPOINT
    value: "subsurface-advisor-vs-endpoint"
  - name: VS_INDEX
    value: "oil_pump_monitor_catalog.subsurface_command.wellbore_vs_index"

  - name: SONIC_ENDPOINT
    value: "subsurface-synthetic-sonic"

user_api_scopes:
  - sql
  - dashboards.genie
